apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aria2
  namespace: aria2
  labels:
    app: aria2
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Aria2
    gethomepage.dev/group: Applications
    gethomepage.dev/icon: mdi-download
    gethomepage.dev/description: Download manager
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: traefik
  hostnames:
    - aria2.homelab.olav.ninja
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aria2
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oidc
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: sablier
