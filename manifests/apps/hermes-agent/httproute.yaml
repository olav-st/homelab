apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: hermes-agent
  namespace: hermes-agent
  labels:
    app.kubernetes.io/instance: hermes-agent
    app.kubernetes.io/name: hermes-agent
  annotations:
    hajimari.io/appName: hermes-agent
    hajimari.io/enable: "true"
    hajimari.io/icon: simple-icons:hermes
spec:
  parentRefs:
    - name: internal
      namespace: traefik
  hostnames:
    - hermes.homelab.olav.ninja
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes-agent
          port: 9119
