apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-agent
  namespace: hermes-agent
  labels:
    app.kubernetes.io/instance: hermes-agent
    app.kubernetes.io/name: hermes-agent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Hermes
    gethomepage.dev/group: Applications
    gethomepage.dev/icon: si-hermes
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: traefik
  hostnames:
    - hermes.homelab.olav.ninja
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes-agent
          port: 9119
