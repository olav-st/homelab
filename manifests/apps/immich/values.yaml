# https://github.com/immich-app/immich-charts/blob/main/charts/immich/values.yaml
immich:
  configuration:
    placeholder: foo # will be replaced by kustomize patch
  persistence:
    library:
      existingClaim: immich-library

controllers:
  main:
    strategy: Recreate # Needed for RWO storage 
    containers:
      main:
        image:
          tag: v3.1.0 # renovate: github-releases=immich-app/immich
        env:
          DB_HOSTNAME: 'immich-postgresql-rw'
          DB_USERNAME: 
            valueFrom:
              secretKeyRef:
                key: username
                name: immich-postgresql-user
          DB_PASSWORD: 
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-postgresql-user
        resources:
          requests:
            gpu.intel.com/i915: 1
          limits:
            gpu.intel.com/i915: 1

envFrom:
  - secretRef:
      name: immich-postgresql-user

valkey:
  enabled: true
  persistence:
    data:
      enabled: false

typesense:
  enabled: true
  persistence:
    tsdata:
      enabled: true
      type: emptyDir

machine-learning:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 2Gi
    limits:
      cpu: 1
      ephemeral-storage: 10Gi
  probes:
    liveness:
      spec:
        initialDelaySeconds: 120

server:
  route:
    main:
      enabled: true
      kind: HTTPRoute
      annotations:
        hajimari.io/enable: 'true'
        hajimari.io/icon: https://avatars.githubusercontent.com/u/109746326
        hajimari.io/appName: Immich
      hostnames:
        - immich.homelab.olav.ninja
      parentRefs:
        - namespace: traefik
          name: internal
