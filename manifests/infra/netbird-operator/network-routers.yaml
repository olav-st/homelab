apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: cluster
  namespace: netbird
spec:
  dnsZoneRef:
    name: cluster.internal
  workloadOverride:
    replicas: 1
    podTemplate:
      spec:
        containers:
          - name: netbird
            resources:
              requests:
                cpu: 50m
          - name: kube-egress-forwarder
            resources:
              requests:
                cpu: 50m
