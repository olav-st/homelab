apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-postgresql
  namespace: keycloak
spec:
  instances: 1
  postgresql:
    parameters:
      timezone: Europe/Oslo
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  storage:
    size: 5G
  priorityClassName: system-cluster-critical # Because many other apps depend on Keycloak when starting up
