apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netbird-tls-certificate
  namespace: netbird
spec:
  secretName: netbird-tls-certificate
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - netbird.homelab.olav.ninja
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: netbird-tls-certificate
  namespace: netbird
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik
  to:
    - group: ""
      kind: Secret
      name: netbird-tls-certificate
