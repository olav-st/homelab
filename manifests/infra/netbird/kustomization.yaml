apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - oidc-client.yaml
  - oidc-scopes.yaml
  - secrets.yaml
  - ./kubernetes-api-expose
  - ./proxy

helmCharts:
- name: netbird
  releaseName: netbird-backend
  namespace: netbird
  repo: https://netbirdio.github.io/helms
  version: 1.9.0
  valuesFile: values.yaml

patches:
  - path: patches/set-deployment-strategy.yaml
