apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-management
  namespace: netbird
spec:
  parentRefs:
    - name: internal
      namespace: traefik
    - name: external
      namespace: traefik
      sectionName: netbird-https
  hostnames:
    - netbird.homelab.olav.ninja
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /management.ManagementService/
        - path:
            type: PathPrefix
            value: /management.ProxyService
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: netbird-backend-management
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-signal
  namespace: netbird
spec:
  parentRefs:
    - name: internal
      namespace: traefik
    - name: external
      namespace: traefik
      sectionName: netbird-https
  hostnames:
    - netbird.homelab.olav.ninja
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange/
      backendRefs:
        - name: netbird-backend-signal
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-relay
  namespace: netbird
spec:
  parentRefs:
    - name: internal
      namespace: traefik
    - name: external
      namespace: traefik
      sectionName: netbird-https
    - name: netbird-public
      namespace: netbird
  hostnames:
    - netbird.homelab.olav.ninja
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /relay
      backendRefs:
        - name: netbird-backend-relay
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  parentRefs:
    - name: internal
      namespace: traefik
    - name: external
      namespace: traefik
      sectionName: netbird-https
  hostnames:
    - netbird.homelab.olav.ninja
  rules:
    - matches:
