apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netbird-proxy-wildcard-cert
spec:
  secretName: netbird-proxy-wildcard-cert
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: "proxy.homelab.olav.ninja"
  dnsNames:
    - "proxy.homelab.olav.ninja"
    - "*.proxy.homelab.olav.ninja"
