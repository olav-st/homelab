apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.homelab.olav.ninja"
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-wildcard-tls-certificate
      allowedRoutes:
        namespaces:
          from: All
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: "homelab.olav.ninja"
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-wildcard-tls-certificate
      allowedRoutes:
        namespaces:
          from: All
    - allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TLSRoute
      hostname: homeassistant.homelab.olav.ninja
      name: homeassistant-tls
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - gitea # Only gitea uses SSH for now
