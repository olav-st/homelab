# https://github.com/jameswynn/helm-charts/blob/main/charts/homepage/values.yaml
enableRbac: true

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: homelab.olav.ninja

config:
  kubernetes:
    mode: cluster
    ingress: true   # other apps still use Traefik/Ingress today
    traefik: true
    gateway: true   # << picks up the new HTTPRoute

  bookmarks:
    - Infrastructure Apps:
        - Netbird:
            - icon: netbird.png
              href: https://netbird.homelab.olav.ninja
        - Keycloak:
            - icon: keycloak.png
              href: https://keycloak.homelab.olav.ninja
        - Longhorn:
            - icon: longhorn.png
              href: https://longhorn.homelab.olav.ninja
    - Monitoring:
        - Hubble:
            - icon: mdi-telescope
              href: https://hubble.homelab.olav.ninja
        - Traefik:
            - icon: traefik.png
              href: https://traefik.homelab.olav.ninja
    - Outside Cluster:
        - OpenWrt:
            - icon: openwrt.png
              href: http://192.168.0.1
        - TrueNAS:
            - icon: truenas.png
              href: https://truenas.proxy.homelab.olav.ninja/
    - External:
        - Cloudflare Dashboard:
            - icon: cloudflare.png
              href: https://dash.cloudflare.com
        - Github Repo:
            - icon: github.png
              href: https://github.com/olav-st/homelab

  services: []

  settings:
    title: Homelab
    theme: dark
    color: slate

  widgets:
    - greeting:
        text_size: xl
    - search:
        provider: google
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true